# Checagens do Nutra Status.
#
# Este arquivo é PÚBLICO: nada de IPs, hosts internos ou tokens aqui.
# Use ${VARIAVEL} para valores que vêm dos secrets do repositório.
# Se a variável não estiver definida, a checagem fica como "ignorado" (não alerta).
#
# Campos comuns: id (único, vira nome de arquivo), nome, grupo, tipo, ativo (padrão true)
# Tipos:
#   http        url, fallback_url?, status_ok_ate (padrão 399), esperar_json?, headers?
#   dns         host, url? (faz GET após resolver o registro A), status_ok_ate (padrão 499)
#   statuspage  url (Atlassian Statuspage: none → online, minor/major → degradado, critical → offline)
#   postgres    usa DB_HOST, DB_PORT, DB_NAME, DB_USERNAME, DB_PASSWORD, DB_SSL, DB_SSL_CA
#   firebase    usa FIREBASE_SERVICE_ACCOUNT_JSON

# ── Plataforma ───────────────────────────────────────────────

[[check]]
id = "api"
nome = "API"
grupo = "Plataforma"
tipo = "http"
url = "https://api.nutraentes.com.br/health"
status_ok_ate = 299
esperar_json = { status = "ok" }

[[check]]
id = "api-web"
nome = "API Web"
grupo = "Plataforma"
tipo = "http"
url = "https://api-web.nutraentes.com.br/health"
status_ok_ate = 299
esperar_json = { status = "ok", banco = true }

[[check]]
id = "engine"
nome = "Engine"
grupo = "Plataforma"
tipo = "http"
url = "${ENGINE_URL}/health"
status_ok_ate = 299
esperar_json = { status = "ok" }

[[check]]
id = "engine-proxy"
nome = "Engine via API"
grupo = "Plataforma"
tipo = "http"
url = "https://api.nutraentes.com.br/engine/health"
status_ok_ate = 299

[[check]]
id = "arnut"
nome = "Arnut"
grupo = "Plataforma"
tipo = "http"
url = "${ARNUT_URL}/info"
status_ok_ate = 299
esperar_json = { status = "operacional" }

[[check]]
id = "n8n"
nome = "n8n"
grupo = "Plataforma"
tipo = "http"
url = "${N8N_URL}/healthz"
status_ok_ate = 299

[[check]]
id = "easypanel"
nome = "EasyPanel"
grupo = "Plataforma"
tipo = "http"
url = "${EASYPANEL_URL}"
status_ok_ate = 499

